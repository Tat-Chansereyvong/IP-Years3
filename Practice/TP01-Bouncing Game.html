<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bouncing Game</title>
    <style>
      body {
        margin: 0;
        background: #e0e6ea;
        color: #e66565;
        font: 40px system-ui;
        display: grid;
        place-items: center;
        height: 100vh;
      }
      canvas {
        background: #e06666;
        border: 2px solid #555;
      }
      #ui {
        position: fixed;
        top: 10px;
        left: 10px;
      }
      button {
        margin-left: 8px;
      }
      /* Make the Restart button larger and easier to click */
      #restart {
        font-size: 25px;
        padding: 13px 18px;
        min-width: 160px;
        height: 58px;
        border-radius: 8px;
        background-color: rgb(145, 217, 241);
        cursor: pointer;
      }
      /* small spacing for high score text */
      #ui span { margin-right: 12px; font-size: 24px; vertical-align: middle; }
    </style>
  </head>
  <body>
    <div id="ui">
      Score: <span id="score"><style></style>0</span>
      High Score: <span id="highScore">0</span>
      <button id="restart">Restart</button>
    </div>
    <canvas id="game" width="480" height="320"></canvas>
    <script>
      // ==== Some setting values ====
      const CANVAS_W = 1200;
      const CANVAS_H = 650;
      const BALL_SPEED = 1; // try 1.5–2.5
      const PADDLE_SPEED = 4; // try 3–5
      const PADDLE_W = 200; // wider paddle helps beginners
      const PADDLE_H = 14;

      let score = 0;
      let running = true;

      // Ball & paddle
      const ball = {
        x: CANVAS_W / 2,
        y: CANVAS_H / 2,
        r: 10,
        dx: BALL_SPEED,
        dy: BALL_SPEED,
      };
      const paddle = {
        x: CANVAS_W / 2 - PADDLE_W / 2,
        y: CANVAS_H - 40,
        w: PADDLE_W,
        h: PADDLE_H,
        speed: PADDLE_SPEED,
        dx: 0,
      };

      // === We should have Global Variables
      // === to keep all the reference objects. So what are the referenced objects we should have?
      // 1. A canvas constant
      const canvas = document.getElementById("game");
      // 2. A canvas' 2D context constant
      const ctx = canvas.getContext("2d");
      // 3. A score element, so we can update the score
      const scoreEl = document.getElementById("score");
      // 4. A restart button, so we can apply click on it
      const restartBtn = document.getElementById("restart");
      // 5. High score element + load saved high score
      const highScoreEl = document.getElementById("highScore");
      let highScore = Number(localStorage.getItem("bouncing_highscore")) || 0;

      // Ensure canvas matches tunables (if you change in HTML, these still enforce)
      canvas.width = CANVAS_W;
      canvas.height = CANVAS_H;

      // === Input: set event listeners once ===
      document.addEventListener("keydown", (e) => {
        if (e.key == "ArrowLeft") paddle.dx = -paddle.speed;
        else if (e.key == "ArrowRight") paddle.dx = paddle.speed;
        else if (e.key.toLowerCase() === "r") {
          // Press R to restart the game
          init();
        }
      });
      document.addEventListener("keyup", (e) => {
        if (e.key == "ArrowLeft" || e.key == "ArrowRight") paddle.dx = 0;
      });
      restartBtn.addEventListener("click", init);

      // === We should define functions as well
      // 1. A function to draw the ball and the paddle - draw() { .... }
      function draw() {
        // Clear screen, to make the canvas blank so we can draw something new on it.
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // Paddle
        ctx.fillStyle = "cyan";
        ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

        // If you lose the game, so message game over instead.
        if (!running) {
            ctx.font = "50px times new roman";
            ctx.fillStyle = "white";
            ctx.fillText("Game Over", CANVAS_W / 2 - 120, CANVAS_H / 2);

            ctx.font = "30px times new roman";
            ctx.fillText("Press R or Click Restart to play again", CANVAS_W / 2 - 230, CANVAS_H / 2 + 50);
        }
        else {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fillStyle = "yellow";
            ctx.fill();
        }   
      }
      // 2. A function to move the paddle left/right - movePaddle() { .... }
      function movePaddle() {
        // move according to current dx (set by key handlers)
        paddle.x += paddle.dx;

        // clamp, make sure you can't move paddle outside the canvas:
        if (paddle.x < 0) paddle.x = 0;
        if (paddle.x + paddle.w > canvas.width) paddle.x = canvas.width - paddle.w;
      }
      // 3. A function to move the ball, it bounces when touch the left/top/right wall of canvas - moveBall() { ..... }
      function moveBall() {
        ball.x += ball.dx;
        ball.y += ball.dy;

        // Left/right walls
        if (ball.x + ball.r > CANVAS_W || ball.x - ball.r < 0) {
          ball.dx *= -1; // reverse direction
        }
        // Top wall
        if (ball.y - ball.r < 0) {
          ball.dy *= -1; // reverse direction
        }
        // Bottom wall - you missed the paddle
        if (ball.y + ball.r > CANVAS_H) {
          running = false; // stop the game
        }
      }
      // 4. A function to check collision with the paddle or miss - checkCollision() { .... }
      function checkCollision() {
        const hitsPaddle =
          ball.y + ball.r >= paddle.y &&
          ball.x > paddle.x &&
          ball.x < paddle.x + paddle.w;

        if (hitsPaddle && ball.dy > 0) {
          ball.dy *= -1.5;
          score++;
          // update high score if needed
          if (score > highScore) {
            highScore = score;
            try {
              localStorage.setItem("bouncing_highscore", String(highScore));
            } catch (e) {
              // ignore storage errors (e.g., private mode)
            }
          }
          updateUI();
        } 
      }
      // 5. A function to update the score - updateUI() { ..... }
      function updateUI() {
        scoreEl.textContent = score;
        highScoreEl.textContent = highScore;
      }

      // === And the loop, to keep the game running
      function init() {
        score = 0;
        running = true;
        ball.x = CANVAS_W / 2;
        ball.y = CANVAS_H / 2;
        ball.dx = BALL_SPEED;
        ball.dy = BALL_SPEED;
        paddle.x = CANVAS_W / 2 - PADDLE_W / 2;
        // ensure highScore is current (in case storage changed)
        highScore = Number(localStorage.getItem("bouncing_highscore")) || highScore;
        updateUI();
      }

      // === Loop ===
      function loop() {
        if (running) {
          movePaddle();
          moveBall();
          checkCollision();
        }
        draw();
        requestAnimationFrame(loop);
      }

      // So we initialize the value
      init();
      // And then, we start the loop so everythign start running
      loop();
    </script>
  </body>
</html>
